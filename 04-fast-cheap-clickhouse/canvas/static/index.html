<!doctype html>
<html lang="en" data-build="20261007-stories1">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080f18"><title>Data Canvas — Explore</title>
  <link rel="stylesheet" href="/canvas/vendor/leaflet.css"><link rel="stylesheet" href="/canvas/style.css?v=20261007-worlds1"><link rel="stylesheet" href="/canvas/scifi.css?v=20261007-worlds1"><link rel="stylesheet" href="/canvas/explore-viz.css?v=20261007-worlds1"><link rel="stylesheet" href="/canvas/datasets.css?v=20261007-worlds1">
  <script defer src="/canvas/vendor/leaflet.js"></script>
  <script defer src="/assets/plotly-cartesian-3.1.0.min.js"></script>
  <script type="module" src="/canvas/app.js?v=20261007-worlds1"></script>
</head>
<body>
  <main class="app-layout">
    <section class="canvas-shell" aria-label="Data canvas">
      <div id="viewport" tabindex="0" aria-label="Pan and zoom the canvas"><div id="spacer"><div id="board"><svg id="connections" aria-hidden="true"></svg></div></div></div>
      <div class="canvas-bottom"><div class="zoom-controls"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-level" title="Reset zoom">100%</button><button id="zoom-in" aria-label="Zoom in">＋</button><span></span><button id="fit" title="Fit all views">Fit</button></div></div>
      <button id="mobile-chat" class="icon-button" aria-label="Open conversation" aria-expanded="false" aria-controls="conversation">◧</button>
      <aside id="detail-panel" class="detail-panel" hidden><div class="detail-heading"><strong id="detail-title">View details</strong><button id="close-detail" class="icon-button" aria-label="Close details">×</button></div><div id="detail-body"></div></aside>
    </section>
    <aside id="conversation" class="conversation" aria-label="Conversation">
      <div class="conversation-heading"><div class="dataset-heading"><label for="dataset-select" class="dataset-label">Explore</label><select id="dataset-select" aria-label="Dataset" title="Switch dataset. Your current chat stays saved."><option value="wildlife">Wildlife</option><option value="maritime">Ships &amp; Storms</option></select><p id="dataset-caption">Worldwide · observations &amp; photos</p></div><details class="chat-settings"><summary aria-label="Canvas settings" title="Canvas settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="#102330"/><circle cx="15" cy="17" r="3" fill="#102330"/></svg></summary><div class="settings-popover"><label for="motion-select">Animation</label><select id="motion-select"><option value="on">Flowing</option><option value="off">Reduced</option><option value="system">Use device setting</option></select><button id="dataset-details" type="button">About this dataset ↗</button><span id="save-status" role="status">Connecting…</span></div></details><button id="close-chat" class="icon-button" aria-label="Close conversation">×</button></div>
      <div class="session-toolbar"><select id="session-select" aria-label="Saved chats" title="Saved chats"><option>Current chat</option></select><button id="new-session" type="button" title="Start a new chat with an empty canvas. This chat stays saved.">＋ New chat</button></div>
      <div id="messages" aria-live="polite"></div>
      <div id="working" role="status" hidden><span class="thinking-dots"><i></i><i></i><i></i></span><span id="working-text">Shaping your view…</span><button id="cancel" aria-label="Cancel current change">Stop</button></div>
      <div id="selection-chip" hidden><div><span id="selection-label"></span><button id="clear-mark" aria-label="Clear marked data">×</button></div><p>Follow-ups stay within this selection.</p><button id="ask-mark">Ask about this ↗</button><button id="photos-mark">＋ Photos</button></div><form id="composer"><div id="target-pill"><span class="target-icon">▧</span><span id="target-text">Canvas · new view</span><button type="button" id="clear-target" aria-label="Clear selected view" hidden>×</button></div><textarea id="prompt" rows="3" placeholder="Ask a question, or request a change…" aria-label="Ask about the data" maxlength="2000"></textarea><div class="composer-bottom"><button type="button" id="intent-toggle" title="Force a new view, even for a change request" class="intent-button" aria-pressed="false">＋ Add alongside</button><button type="submit" id="send" aria-label="Send request">↑</button></div></form>
    </aside>
  </main>
  <div id="toast" role="status" hidden></div>
  <div id="login-screen" hidden><form id="login-form" class="login-card"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><h1>A world, waiting to unfold.</h1><p>Sign in with the demo account to open your canvas.</p><label>Email<input id="email" type="email" autocomplete="username" value="demo@example.invalid" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><p id="login-error" role="alert"></p><button class="primary-button" type="submit">Open my canvas →</button><small>Wildlife · Ships &amp; Storms · Your saved workspaces</small></form></div>
</body></html>
