name: ch-exploration
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.19.9
    ports: ["127.0.0.1:18123:8123"]
    env_file: [runtime/clickhouse.env]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./runtime/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/demo.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  mongodb:
    image: mongo:8.0.20
    command: ["mongod", "--noauth", "--bind_ip_all"]
    volumes: [mongo-data:/data/db]
  mcp:
    build: ./visual-mcp
    env_file: [runtime/mcp.env]
    volumes: [./evidence:/evidence]
    depends_on:
      clickhouse: {condition: service_healthy}
  gateway:
    build: ./gateway
    ports: ["127.0.0.1:3081:8080"]
    env_file: [/run/ch-exploration-secrets/openrouter.env]
    volumes:
      - ./evidence:/evidence
      - ./vendor/plotly-3.1.0.min.js:/assets/plotly-3.1.0.min.js:ro
      - ./vendor/plotly-cartesian-3.1.0.min.js:/assets/plotly-cartesian-3.1.0.min.js:ro
  librechat:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8
    user: "0:0"
    ports: ["127.0.0.1:3080:3080"]
    env_file: [runtime/librechat.env]
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - lc-data:/app/data
      - lc-uploads:/app/uploads
      - lc-images:/app/client/public/images
      - lc-logs:/app/logs
    depends_on: [mongodb, mcp, gateway]
volumes:
  ch-data:
  mongo-data:
  lc-data:
  lc-uploads:
  lc-images:
  lc-logs:
